<!doctype html><meta charset="utf-8"><title>Temporary reel QA</title><style>body{margin:0;background:#ddd}iframe{display:block;width:375px;height:812px;border:0}</style><iframe title="Phone-width home" src="/home#latest-work" allow="autoplay;fullscreen"></iframe>
<pre id="results" style="position:absolute;left:400px;top:0;white-space:pre-wrap"></pre><script>
const frame=document.querySelector('iframe'),out=document.getElementById('results'),rows=[];let previous='';
frame.addEventListener('load',()=>{const doc=frame.contentDocument;const record=()=>{const stage=doc.querySelector('.home-video-stage');if(!stage)return;const r={project:stage.dataset.videoProject,ready:stage.dataset.videoReady,playing:stage.dataset.videoPlaying,held:stage.dataset.videoHeld,players:stage.querySelectorAll('video,iframe').length,source:stage.querySelector('video')?.getAttribute('src'),width:doc.documentElement.clientWidth,overflow:doc.documentElement.scrollWidth>doc.documentElement.clientWidth};const key=JSON.stringify(r);if(key===previous)return;previous=key;rows.push({...r,at:Math.round(performance.now())});out.textContent=JSON.stringify(rows,null,2);};new MutationObserver(record).observe(doc.body,{subtree:true,attributes:true,childList:true});record();});
</script>
