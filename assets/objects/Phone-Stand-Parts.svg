<text x="570" y="365" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#3B2923" text-anchor="start">Tabs: 6 long x 12 high</text>
<text x="570" y="389" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#3B2923" text-anchor="start">Full 6 mm sheet thickness passes through each slot.</text>
<text x="570" y="414" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#3B2923" text-anchor="start">0.15 mm total nominal clearance, before kerf setup.</text>
<text x="570" y="437" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#3B2923" text-anchor="start">Re-size slots and tabs to measured sheet thickness.</text>
<polyline points="36.00,514.00 964.00,514.00" fill="none" stroke="#F2EBDD" stroke-width="2"/>
<text x="75" y="551" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#3B2923" text-anchor="start">Assembly</text>
<text x="75" y="579" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#3B2923" text-anchor="start">1. Cut a joint coupon and adjust kerf / clearance.</text>
<text x="75" y="602" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#3B2923" text-anchor="start">2. Fit both crossbars into one side support.</text>
<text x="75" y="625" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#3B2923" text-anchor="start">3. Add the other side; glue, square and clamp.</text>
<text x="75" y="648" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#3B2923" text-anchor="start">4. Sand contacts; add thin felt if the phone needs it.</text>
<text x="570" y="551" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#3B2923" text-anchor="start">Release checks</text>
<text x="570" y="579" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#3B2923" text-anchor="start">Test the smallest and largest intended phones.</text>
<text x="570" y="602" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#3B2923" text-anchor="start">Confirm case fit, front retention and cable access.</text>
<text x="570" y="625" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#3B2923" text-anchor="start">Push lightly from front, rear and both sides.</text>
<text x="570" y="648" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#3B2923" text-anchor="start">Do not treat this drawing as a tested load rating.</text>
